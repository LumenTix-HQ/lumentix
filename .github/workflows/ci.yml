name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: lumentix_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumentix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Check pending migrations
        working-directory: backend
        run: npm run check-migrations

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Build
        working-directory: backend
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Lint
        working-directory: backend
        run: npm run lint

  readme-script-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check README script names match package.json
        run: |
          # Extract all "npm run <script>" references from the README
          readme_scripts=$(grep -oP '(?<=npm run )[a-zA-Z0-9:_-]+' backend/README.md | sort -u)

          # Extract actual script names from package.json
          package_scripts=$(node -e "const p=require('./backend/package.json'); console.log(Object.keys(p.scripts).join('\n'))" | sort -u)

          # Check each referenced script exists in package.json
          missing=()
          while IFS= read -r script; do
            if ! echo "$package_scripts" | grep -qx "$script"; then
              missing+=("$script")
            fi
          done <<< "$readme_scripts"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ README references scripts not found in package.json:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

          echo "✅ All README npm run commands exist in package.json"
