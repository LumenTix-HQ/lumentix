name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: lumentix_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumentix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumentix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run migrations and check for entity/migration drift
        working-directory: backend
        run: npm run check-migrations

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify package-lock.json is in sync
        working-directory: backend
        run: git diff --exit-code package-lock.json

      - name: Check for undeclared dependencies
        working-directory: backend
        run: |
          npx --yes depcheck@1.4.7 --json | node -e "
            const report = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const missing = Object.keys(report.missing);
            if (missing.length) { console.error('Undeclared imports: ' + missing.join(', ')); process.exit(1); }
          "

      - name: Build
        working-directory: backend
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint
